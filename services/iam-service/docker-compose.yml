services:
  iam-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam
      POSTGRES_DB: iam
    ports:
      - "5432:5432"
    volumes:
      - iam_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam"]
      interval: 5s
      timeout: 3s
      retries: 5

  iam-service:
    build: .
    environment:
      IAM_DB_HOST: iam-postgres
      IAM_DB_PORT: 5432
      IAM_DB_USER: iam
      IAM_DB_PASSWORD: iam
      IAM_DB_NAME: iam
    ports:
      - "8000:8000"
    depends_on:
      iam-postgres:
        condition: service_healthy

volumes:
  iam_pg_data:
